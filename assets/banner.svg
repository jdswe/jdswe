<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="Animated scene: a smiling developer with headphones behind a laptop, code floating beside. Jose David Carranza, software engineering student learning full stack.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe8ff"/>
      <stop offset="0.55" stop-color="#ffe3f0"/>
      <stop offset="1" stop-color="#fff0c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.33" stop-color="#ffc233"/>
      <stop offset="0.66" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <clipPath id="line1">
      <rect x="395" y="128" width="255" height="26">
        <animate attributeName="width" values="0;0;255;255;0" keyTimes="0;0.05;0.28;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="line2">
      <rect x="395" y="154" width="172" height="26">
        <animate attributeName="width" values="0;0;0;172;172;0" keyTimes="0;0.05;0.30;0.45;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="800" height="270" rx="14" fill="url(#bg)"/>
  <circle cx="200" cy="120" r="170" fill="url(#glow)"/>

  <!-- sun -->
  <g transform="translate(742 48)">
    <g stroke="#ffb703" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-34" x2="0" y2="-26"/><line x1="0" y1="34" x2="0" y2="26"/>
      <line x1="-34" y1="0" x2="-26" y2="0"/><line x1="34" y1="0" x2="26" y2="0"/>
      <line x1="-24" y1="-24" x2="-18" y2="-18"/><line x1="24" y1="24" x2="18" y2="18"/>
      <line x1="-24" y1="24" x2="-18" y2="18"/><line x1="24" y1="-24" x2="18" y2="-18"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="24s" repeatCount="indefinite"/>
    </g>
    <circle r="17" fill="#ffc233"/>
  </g>

  <!-- desk -->
  <rect x="24" y="258" width="350" height="12" rx="5" fill="#c98b5a"/>
  <rect x="24" y="258" width="350" height="3" rx="1.5" fill="#e6b184"/>

  <!-- plant -->
  <g>
    <g>
      <ellipse cx="346" cy="226" rx="5" ry="13" fill="#22c55e" transform="rotate(-20 346 240)"/>
      <ellipse cx="354" cy="224" rx="5" ry="15" fill="#16a34a" transform="rotate(15 354 240)"/>
      <ellipse cx="350" cy="222" rx="4" ry="14" fill="#4ade80"/>
      <animateTransform attributeName="transform" type="rotate" values="-3 350 240;3 350 240;-3 350 240" dur="4s" repeatCount="indefinite"/>
    </g>
    <rect x="340" y="240" width="20" height="18" rx="3" fill="#ff7a59"/>
  </g>

  <!-- floating code window -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" repeatCount="indefinite"/>
    <rect x="212" y="44" width="150" height="122" rx="10" fill="#14192b" stroke="#8b5cf6" stroke-width="4"/>
    <circle cx="228" cy="58" r="4" fill="#ff6b6b"/><circle cx="241" cy="58" r="4" fill="#ffc233"/><circle cx="254" cy="58" r="4" fill="#4ade80"/>
    <rect x="228" y="76" width="70" height="7" rx="3.5" fill="#60a5fa"><animate attributeName="width" values="0;0;70;70;0" keyTimes="0;0.02;0.2;0.9;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="240" y="92" width="96" height="7" rx="3.5" fill="#2dd4bf"><animate attributeName="width" values="0;0;96;96;0" keyTimes="0;0.18;0.34;0.9;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="240" y="108" width="56" height="7" rx="3.5" fill="#ffc233"><animate attributeName="width" values="0;0;56;56;0" keyTimes="0;0.34;0.46;0.9;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="252" y="124" width="80" height="7" rx="3.5" fill="#c084fc"><animate attributeName="width" values="0;0;80;80;0" keyTimes="0;0.46;0.62;0.9;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="228" y="140" width="46" height="7" rx="3.5" fill="#ff6b6b"><animate attributeName="width" values="0;0;46;46;0" keyTimes="0;0.62;0.72;0.9;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="278" y="138" width="3" height="11" fill="#ffffff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- floating symbols -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">
    <text x="382" y="130" opacity="0">&lt;/&gt;
      <animate attributeName="y" values="150;60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="200" y="130" opacity="0" fill="#0d9488">{ }
      <animate attributeName="y" values="150;60" dur="5s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="1.7s" repeatCount="indefinite"/>
    </text>
    <text x="372" y="130" opacity="0" fill="#ea580c">;
      <animate attributeName="y" values="150;60" dur="5s" begin="3.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="3.3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- person, blocky pixel style, front view -->
  <rect x="52" y="200" width="22" height="70" fill="#2a55bd"/>
  <rect x="146" y="200" width="22" height="70" fill="#2a55bd"/>
  <rect x="70" y="196" width="80" height="74" fill="#2f5fd0"/>
  <rect x="88" y="196" width="44" height="8" fill="#1f3f95"/>
  <rect x="98" y="182" width="24" height="16" fill="#cf9770"/>
  <rect x="74" y="154" width="6" height="14" fill="#cf9770"/>
  <rect x="140" y="154" width="6" height="14" fill="#cf9770"/>
  <rect x="80" y="126" width="60" height="62" fill="#d9a67d"/>
  <rect x="80" y="118" width="60" height="22" fill="#1c1c26"/>
  <rect x="88" y="110" width="44" height="10" fill="#1c1c26"/>
  <rect x="80" y="126" width="8" height="26" fill="#1c1c26"/>
  <rect x="132" y="126" width="8" height="26" fill="#1c1c26"/>
  <rect x="88" y="138" width="14" height="6" fill="#1c1c26"/>
  <rect x="118" y="138" width="14" height="6" fill="#1c1c26"/>
  <rect x="96" y="112" width="14" height="3" fill="#3a3a4d"/>
  <rect x="90" y="149" width="16" height="5" fill="#1c1c26"/>
  <rect x="114" y="149" width="16" height="5" fill="#1c1c26"/>
  <rect x="96" y="158" width="8" height="9" fill="#ffffff"/>
  <rect x="116" y="158" width="8" height="9" fill="#ffffff"/>
  <rect x="100" y="158" width="4" height="9" fill="#2a1f1a">
    <animate attributeName="height" values="9;9;1;9;9" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="120" y="158" width="4" height="9" fill="#2a1f1a">
    <animate attributeName="height" values="9;9;1;9;9" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="106" y="168" width="8" height="5" fill="#b97f58"/>
  <rect x="100" y="178" width="20" height="4" fill="#b5624d"/>
  <rect x="97" y="175" width="4" height="4" fill="#b5624d"/>
  <rect x="119" y="175" width="4" height="4" fill="#b5624d"/>
  <!-- headphones on the head -->
  <rect x="82" y="108" width="56" height="12" fill="#1c1c26"/>
  <rect x="86" y="101" width="48" height="6" fill="#ffc233"/>
  <rect x="79" y="105" width="9" height="6" fill="#ffc233"/>
  <rect x="132" y="105" width="9" height="6" fill="#ffc233"/>
  <rect x="75" y="109" width="6" height="46" fill="#ffc233"/>
  <rect x="139" y="109" width="6" height="46" fill="#ffc233"/>
  <rect x="68" y="150" width="14" height="28" rx="3" fill="#ffc233"/>
  <rect x="138" y="150" width="14" height="28" rx="3" fill="#ffc233"/>
  <rect x="70" y="156" width="6" height="16" rx="1.5" fill="#e0a100"/>
  <rect x="144" y="156" width="6" height="16" rx="1.5" fill="#e0a100"/>

  <!-- laptop (back view) -->
  <rect x="62" y="196" width="96" height="58" rx="7" fill="#8b5cf6"/>
  <rect x="54" y="252" width="112" height="8" rx="4" fill="#6d4bd6"/>
  <text x="110" y="232" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="17" font-weight="700" fill="#ffffff" opacity="0.9">&lt;/&gt;</text>

  <!-- mug and steam -->
  <rect x="180" y="238" width="19" height="20" rx="3" fill="#ff7a59"/>
  <path d="M199 243 C207 243 207 254 199 254" fill="none" stroke="#ff7a59" stroke-width="3"/>
  <path d="M186 234 C182 228 190 225 186 219" fill="none" stroke="#8a93b8" stroke-width="2" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/></path>
  <path d="M194 234 C190 228 198 225 194 219" fill="none" stroke="#8a93b8" stroke-width="2" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1.2s" repeatCount="indefinite"/></path>

  <!-- text -->
  <text x="395" y="108" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="24" font-weight="700" fill="#1c2233">Jose David Carranza</text>
  <text x="395" y="146" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#2563eb" textLength="255" lengthAdjust="spacingAndGlyphs" clip-path="url(#line1)">Software engineering student</text>
  <text x="395" y="172" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#0d9488" textLength="172" lengthAdjust="spacingAndGlyphs" clip-path="url(#line2)">learning full stack</text>
  <rect x="395" y="130" width="2" height="20" fill="#1c2233">
    <animate attributeName="x" values="395;395;650;395;567;567;395" keyTimes="0;0.05;0.28;0.30;0.45;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y" values="130;130;130;156;156;156;130" keyTimes="0;0.05;0.28;0.30;0.45;0.9;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect x="395" y="204" width="365" height="5" rx="2.5" fill="url(#rainbow)"/>
</svg>
