<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="Animated scene: a developer typing code on a monitor. Jose David Carranza, software engineering student learning full stack.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe8ff"/>
      <stop offset="0.55" stop-color="#ffe3f0"/>
      <stop offset="1" stop-color="#fff0c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.33" stop-color="#ffc233"/>
      <stop offset="0.66" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <clipPath id="line1">
      <rect x="395" y="128" width="255" height="26">
        <animate attributeName="width" values="0;0;255;255;0" keyTimes="0;0.05;0.28;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="line2">
      <rect x="395" y="154" width="172" height="26">
        <animate attributeName="width" values="0;0;0;172;172;0" keyTimes="0;0.05;0.30;0.45;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="800" height="270" rx="14" fill="url(#bg)"/>
  <circle cx="245" cy="105" r="150" fill="url(#glow)"/>

  <!-- sun -->
  <g transform="translate(742 48)">
    <g stroke="#ffb703" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-34" x2="0" y2="-26"/><line x1="0" y1="34" x2="0" y2="26"/>
      <line x1="-34" y1="0" x2="-26" y2="0"/><line x1="34" y1="0" x2="26" y2="0"/>
      <line x1="-24" y1="-24" x2="-18" y2="-18"/><line x1="24" y1="24" x2="18" y2="18"/>
      <line x1="-24" y1="24" x2="-18" y2="18"/><line x1="24" y1="-24" x2="18" y2="-18"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="24s" repeatCount="indefinite"/>
    </g>
    <circle r="17" fill="#ffc233"/>
  </g>

  <!-- plant -->
  <g>
    <g>
      <ellipse cx="46" cy="186" rx="5" ry="13" fill="#22c55e" transform="rotate(-20 46 198)"/>
      <ellipse cx="54" cy="184" rx="5" ry="15" fill="#16a34a" transform="rotate(15 54 198)"/>
      <ellipse cx="50" cy="182" rx="4" ry="14" fill="#4ade80"/>
      <animateTransform attributeName="transform" type="rotate" values="-3 50 198;3 50 198;-3 50 198" dur="4s" repeatCount="indefinite"/>
    </g>
    <rect x="40" y="198" width="20" height="16" rx="3" fill="#ff7a59"/>
  </g>

  <!-- desk -->
  <rect x="24" y="214" width="330" height="12" rx="5" fill="#c98b5a"/>
  <rect x="24" y="214" width="330" height="3" rx="1.5" fill="#e6b184"/>

  <!-- monitor -->
  <rect x="237" y="168" width="16" height="38" fill="#6b7399"/>
  <rect x="210" y="204" width="70" height="8" rx="4" fill="#6b7399"/>
  <rect x="150" y="38" width="190" height="130" rx="9" fill="#14192b" stroke="#8b5cf6" stroke-width="4"/>

  <!-- code lines (grow and reset) -->
  <rect x="166" y="56" width="90" height="7" rx="3.5" fill="#60a5fa">
    <animate attributeName="width" values="0;0;90;90;0" keyTimes="0;0.02;0.2;0.9;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="182" y="72" width="120" height="7" rx="3.5" fill="#2dd4bf">
    <animate attributeName="width" values="0;0;120;120;0" keyTimes="0;0.18;0.34;0.9;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="182" y="88" width="70" height="7" rx="3.5" fill="#ffc233">
    <animate attributeName="width" values="0;0;70;70;0" keyTimes="0;0.34;0.46;0.9;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="198" y="104" width="100" height="7" rx="3.5" fill="#c084fc">
    <animate attributeName="width" values="0;0;100;100;0" keyTimes="0;0.46;0.62;0.9;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="182" y="120" width="56" height="7" rx="3.5" fill="#ff6b6b">
    <animate attributeName="width" values="0;0;56;56;0" keyTimes="0;0.62;0.72;0.9;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="166" y="136" width="40" height="7" rx="3.5" fill="#60a5fa">
    <animate attributeName="width" values="0;0;40;40;0" keyTimes="0;0.72;0.8;0.9;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="212" y="134" width="3" height="11" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- floating symbols -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">
    <text x="352" y="120" opacity="0">&lt;/&gt;
      <animate attributeName="y" values="130;70" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="372" y="120" opacity="0" fill="#0d9488">{ }
      <animate attributeName="y" values="130;70" dur="5s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="1.7s" repeatCount="indefinite"/>
    </text>
    <text x="344" y="120" opacity="0" fill="#ea580c">;
      <animate attributeName="y" values="130;70" dur="5s" begin="3.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="3.3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- keyboard -->
  <rect x="165" y="205" width="125" height="9" rx="3" fill="#8b5cf6"/>

  <!-- mug and steam -->
  <rect x="300" y="196" width="19" height="18" rx="3" fill="#ff7a59"/>
  <path d="M319 200 C327 200 327 210 319 210" fill="none" stroke="#ff7a59" stroke-width="3"/>
  <path d="M305 192 C301 186 309 183 305 177" fill="none" stroke="#8a93b8" stroke-width="2" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M313 192 C309 186 317 183 313 177" fill="none" stroke="#8a93b8" stroke-width="2" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- person, seen from behind -->
  <path d="M62 266 C58 212 78 190 100 190 C122 190 142 212 138 266 Z" fill="#ff6b6b"/>
  <path d="M72 204 C76 178 124 178 128 204 C114 212 86 212 72 204 Z" fill="#e5484d"/>
  <rect x="92" y="170" width="16" height="24" rx="6" fill="#f2c9a0"/>
  <ellipse cx="100" cy="190" rx="10" ry="3.5" fill="#d9a77b"/>
  <ellipse cx="100" cy="156" rx="21" ry="23" fill="#2b2d42"/>
  <path d="M89 142 C96 138 104 138 111 142" fill="none" stroke="#464a78" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M77 160 C77 128 123 128 123 160" fill="none" stroke="#ffc233" stroke-width="4" stroke-linecap="round"/>
  <rect x="71" y="156" width="9" height="16" rx="4" fill="#ffc233"/>
  <rect x="120" y="156" width="9" height="16" rx="4" fill="#ffc233"/>

  <!-- arms and typing hands -->
  <path d="M128 214 C146 214 160 208 184 205" fill="none" stroke="#ff6b6b" stroke-width="13" stroke-linecap="round"/>
  <path d="M130 226 C160 226 190 216 214 205" fill="none" stroke="#e5484d" stroke-width="13" stroke-linecap="round"/>
  <circle cx="186" cy="204" r="6" fill="#f2c9a0">
    <animate attributeName="cy" values="204;200;204" dur="0.45s" repeatCount="indefinite"/>
  </circle>
  <circle cx="216" cy="204" r="6" fill="#f2c9a0">
    <animate attributeName="cy" values="204;200;204" dur="0.45s" begin="0.2s" repeatCount="indefinite"/>
  </circle>

  <!-- text -->
  <text x="395" y="108" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="24" font-weight="700" fill="#1c2233">Jose David Carranza</text>
  <text x="395" y="146" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#2563eb" textLength="255" lengthAdjust="spacingAndGlyphs" clip-path="url(#line1)">Software engineering student</text>
  <text x="395" y="172" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#0d9488" textLength="172" lengthAdjust="spacingAndGlyphs" clip-path="url(#line2)">learning full stack</text>
  <rect x="395" y="130" width="2" height="20" fill="#1c2233">
    <animate attributeName="x" values="395;395;650;395;567;567;395" keyTimes="0;0.05;0.28;0.30;0.45;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y" values="130;130;130;156;156;156;130" keyTimes="0;0.05;0.28;0.30;0.45;0.9;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect x="395" y="204" width="365" height="5" rx="2.5" fill="url(#rainbow)"/>
</svg>
